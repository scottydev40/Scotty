<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none"
     stroke="currentColor" stroke-width="3.4"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- top arrow: sweep up the left, run right along the top, arrowhead right -->
  <path d="M 9 30 C 8.5 20, 13 15, 21 15 L 30 15"/>
  <path d="M 25.5 9.5 L 31.5 15 L 25.5 20.5"/>
  <!-- bottom arrow: 180° rotation — sweep down the right, run left, arrowhead left -->
  <path d="M 39 18 C 39.5 28, 35 33, 27 33 L 18 33"/>
  <path d="M 22.5 38.5 L 16.5 33 L 22.5 27.5"/>
</svg>
