<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none"
     stroke="#16a34a" stroke-width="5"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- Fills the whole canvas edge-to-edge (art touches all four sides, only the
       round-cap radius as margin) so the glyph stays as large as possible at a
       fixed panel/tray size. Top arrow: up the left, right along the top. -->
  <path d="M 4 33 C 3 16, 11 8.5, 23 8.5 L 33 8.5"/>
  <path d="M 27 2.5 L 36 8.5 L 27 14.5"/>
  <!-- Bottom arrow: 180° rotation — down the right, left along the bottom. -->
  <path d="M 44 15 C 45 32, 37 39.5, 25 39.5 L 15 39.5"/>
  <path d="M 21 45.5 L 12 39.5 L 21 33.5"/>
</svg>
