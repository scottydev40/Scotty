name: Release Nearby QML Tray App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_COLOR: true

permissions:
  contents: write

jobs:
  build-and-release-linux:
    name: Build and Release Linux Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Store build cache per workflow.
          disk-cache: ${{ github.workflow }}
          # Share repository cache between workflows.
          repository-cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libssl-dev \
            libsystemd-dev \
            libcurlpp-dev \
            libasound2-dev \
            libunistring-dev \
            libldap-dev \
            libkrb5-dev \
            libgpg-error-dev \
            libbluetooth-dev \
            libxkbcommon-dev \
            patchelf \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-wayland \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libqrencode-dev

      - name: Build and install Nearby Sharing API shared library
        id: nearby
        run: |
          INSTALL_PREFIX="$RUNNER_TEMP/nearby-install"
          bazel build \
            --check_visibility=false \
            --spawn_strategy=standalone \
            --cxxopt=-std=c++20 \
            --host_cxxopt=-std=c++20 \
            --@com_google_protobuf//bazel/toolchains:prefer_prebuilt_protoc=true \
            --copt='-DGITHUB_BUILD' \
            --copt='-fvisibility=hidden' \
            --cxxopt='-fvisibility-inlines-hidden' \
            //sharing/linux:nearby_sharing_api_shared
          BAZEL_BIN="$(bazel info bazel-bin)"
          install -d "$INSTALL_PREFIX/lib"
          install -d "$INSTALL_PREFIX/include/sharing/linux"
          install -m 0755 "$BAZEL_BIN/sharing/linux/libnearby_sharing_api_shared.so" "$INSTALL_PREFIX/lib/"
          install -m 0644 "sharing/linux/nearby_sharing_api.h" "$INSTALL_PREFIX/include/sharing/linux/"
          echo "nearby_prefix=$INSTALL_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Configure QML tray app
        run: |
          STAGING="$RUNNER_TEMP/staging"
          cmake -S sharing/linux/qml_tray_app \
                -B sharing/linux/qml_tray_app/build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$STAGING" \
                -DNEARBY_PREFIX="${{ steps.nearby.outputs.nearby_prefix }}"

      - name: Build QML tray app
        run: cmake --build sharing/linux/qml_tray_app/build -j

      - name: Download AppImage tooling
        run: |
          TOOLS="$GITHUB_WORKSPACE/.appimage-tools"
          mkdir -p "$TOOLS"
          base_ld="https://github.com/linuxdeploy"
          curl -fsSL -o "$TOOLS/linuxdeploy-x86_64.AppImage" \
            "$base_ld/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o "$TOOLS/linuxdeploy-plugin-qt-x86_64.AppImage" \
            "$base_ld/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          curl -fsSL -o "$TOOLS/appimagetool-x86_64.AppImage" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          curl -fsSL -o "$TOOLS/runtime-x86_64" \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64"
          chmod +x "$TOOLS"/*.AppImage "$TOOLS/runtime-x86_64"

      - name: Build AppImage
        env:
          # The tool AppImages run without libfuse2 on the CI runner.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          BINARY: sharing/linux/qml_tray_app/build/scotty
          SHARED_LIB: ${{ steps.nearby.outputs.nearby_prefix }}/lib/libnearby_sharing_api_shared.so
        run: |
          OUTPUT_DIR="$RUNNER_TEMP" \
            sharing/linux/qml_tray_app/packaging/build-appimage.sh
          echo "appimage=$RUNNER_TEMP/Scotty-x86_64.AppImage" >> "$GITHUB_ENV"
          echo "appimage_name=Scotty-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: AppImage checksum
        run: |
          cd "$RUNNER_TEMP"
          sha256sum "${{ env.appimage_name }}" > "${{ env.appimage_name }}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scotty-appimage-x86_64
          path: |
            ${{ env.appimage }}
            ${{ env.appimage }}.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.appimage }}
            ${{ env.appimage }}.sha256

  # Build the Flatpak from source and export it, signed, into the self-hosted
  # OSTree repo served at https://scottydev40.github.io/repo/, so in-app
  # `flatpak update` actually finds the new release. Without this the Flatpak
  # channel silently lags the GitHub AppImage release and self-update is a no-op.
  #
  # Requires two repo secrets; the job self-skips (no failure) when either is
  # missing, so forks and secret-less runs are unaffected:
  #   SCOTTY_FLATPAK_GPG_KEY  ASCII-armored private signing key
  #                           (`gpg --armor --export-secret-keys FB5293E0EAEE66FB5235DE0278F60844B9C1E3F6`)
  #   PAGES_DEPLOY_TOKEN      token with contents:write on scottydev40/scottydev40.github.io
  publish-flatpak:
    name: Publish Flatpak to self-hosted repo
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Check required secrets
        id: gate
        env:
          GPG_KEY: ${{ secrets.SCOTTY_FLATPAK_GPG_KEY }}
          PAGES_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -n "$GPG_KEY" ] && [ -n "$PAGES_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Flatpak publish skipped — set SCOTTY_FLATPAK_GPG_KEY and PAGES_DEPLOY_TOKEN secrets to enable."
          fi

      - name: Checkout Scotty
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Bazelisk
        if: steps.gate.outputs.ok == 'true'
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-flatpak
          repository-cache: true

      - name: Install Flatpak toolchain
        if: steps.gate.outputs.ok == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.kde.Platform//6.9 org.kde.Sdk//6.9

      - name: Import signing key
        if: steps.gate.outputs.ok == 'true'
        env:
          GPG_KEY: ${{ secrets.SCOTTY_FLATPAK_GPG_KEY }}
        run: printf '%s' "$GPG_KEY" | gpg --batch --import

      - name: Checkout Pages repo
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v6
        with:
          repository: scottydev40/scottydev40.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages
          persist-credentials: true

      - name: Build, sign, export, and push
        if: steps.gate.outputs.ok == 'true'
        env:
          PAGES_DIR: ${{ github.workspace }}/pages
        run: |
          git config --global user.name "Scotty Release Bot"
          git config --global user.email "scottydev40@users.noreply.github.com"
          packaging/flatpak/publish-repo.sh
